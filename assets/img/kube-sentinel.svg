<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg-kube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-kube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="16" fill="url(#bg-kube)" stroke="#334155" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="24" y="24" width="752" height="48" rx="8" fill="#1e293b" stroke="#334155"/>
  <circle cx="52" cy="48" r="6" fill="#ef4444"/>
  <circle cx="72" cy="48" r="6" fill="#f59e0b"/>
  <circle cx="92" cy="48" r="6" fill="#10b981"/>
  <text x="120" y="53" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">k8s-cluster // namespace: production-us-east-1</text>
  <rect x="620" y="36" width="136" height="24" rx="12" fill="#0284c7" opacity="0.2"/>
  <text x="635" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">● MESH HEALTHY</text>

  <!-- DAG Topology Nodes -->
  <!-- Node 1: Ingress -->
  <rect x="60" y="160" width="140" height="80" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="195" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">ingress-proxy</text>
  <text x="80" y="218" font-family="sans-serif" font-size="11" fill="#94a3b8">Replicas: 3/3 | 4ms</text>

  <!-- Node 2: Auth -->
  <rect x="260" y="100" width="140" height="80" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="280" y="135" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">auth-service</text>
  <text x="280" y="158" font-family="sans-serif" font-size="11" fill="#94a3b8">Replicas: 2/2 | 8ms</text>

  <!-- Node 3: Payment -->
  <rect x="260" y="220" width="140" height="80" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="275" y="255" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">payment-gate</text>
  <text x="275" y="278" font-family="sans-serif" font-size="11" fill="#94a3b8">Replicas: 4/4 | 12ms</text>

  <!-- Node 4: Database -->
  <rect x="470" y="160" width="150" height="80" rx="10" fill="#0f172a" stroke="#dfa951" stroke-width="2"/>
  <text x="490" y="195" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">postgres-cluster</text>
  <text x="490" y="218" font-family="sans-serif" font-size="11" fill="#94a3b8">Primary Master | 2ms</text>

  <!-- Connection Edges -->
  <path d="M 200 200 L 260 140" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 200 200 L 260 260" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 400 140 L 470 200" stroke="#10b981" stroke-width="2"/>
  <path d="M 400 260 L 470 200" stroke="#38bdf8" stroke-width="2"/>

  <!-- Footer Banner -->
  <rect x="24" y="324" width="752" height="52" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="355" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">KUBE-SENTINEL</text>
  <text x="200" y="354" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">Autonomous K8s Service Mesh, eBPF Span Tracing & Chaos Engine</text>
  <rect x="650" y="336" width="110" height="28" rx="6" fill="url(#accent-kube)"/>
  <text x="668" y="354" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">GO + EBPF</text>
</svg>
