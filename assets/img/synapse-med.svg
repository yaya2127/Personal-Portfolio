<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg-med" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accent-med" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="16" fill="url(#bg-med)" stroke="#065f46" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="24" y="24" width="752" height="48" rx="8" fill="#064e3b" stroke="#047857"/>
  <text x="48" y="53" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#34d399">ICU WARD MONITOR // BED-01 (CRITICAL CARE)</text>
  <rect x="600" y="36" width="156" height="24" rx="12" fill="#065f46"/>
  <text x="618" y="52" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">NEWS2 SCORE: 0 (LOW)</text>

  <!-- ECG Waveform Grid -->
  <rect x="24" y="90" width="520" height="210" rx="10" fill="#022c22" stroke="#047857"/>
  <path d="M 30 195 L 80 195 L 90 160 L 100 230 L 115 120 L 130 250 L 140 195 L 180 195 L 230 195 L 240 160 L 250 230 L 265 120 L 280 250 L 290 195 L 340 195 L 390 195 L 400 160 L 410 230 L 425 120 L 440 250 L 450 195 L 530 195" fill="none" stroke="#10b981" stroke-width="3"/>
  <text x="40" y="120" font-family="monospace" font-size="14" font-weight="700" fill="#34d399">ECG Lead II (60 FPS)</text>

  <!-- Vitals Side Panel -->
  <rect x="560" y="90" width="216" height="65" rx="8" fill="#064e3b" stroke="#047857"/>
  <text x="575" y="115" font-family="sans-serif" font-size="11" fill="#a7f3d0">HEART RATE</text>
  <text x="575" y="145" font-family="monospace" font-size="28" font-weight="800" fill="#10b981">72 <tspan font-size="14">BPM</tspan></text>

  <rect x="560" y="163" width="216" height="65" rx="8" fill="#064e3b" stroke="#047857"/>
  <text x="575" y="188" font-family="sans-serif" font-size="11" fill="#a7f3d0">OXYGEN SAT (SpO2)</text>
  <text x="575" y="218" font-family="monospace" font-size="28" font-weight="800" fill="#38bdf8">99 <tspan font-size="14">%</tspan></text>

  <rect x="560" y="235" width="216" height="65" rx="8" fill="#064e3b" stroke="#047857"/>
  <text x="575" y="260" font-family="sans-serif" font-size="11" fill="#a7f3d0">BLOOD PRESSURE</text>
  <text x="575" y="290" font-family="monospace" font-size="24" font-weight="800" fill="#f59e0b">120/80 <tspan font-size="14">mmHg</tspan></text>

  <!-- Footer Banner -->
  <rect x="24" y="324" width="752" height="52" rx="8" fill="#064e3b" stroke="#047857"/>
  <text x="44" y="355" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">SYNAPSE-MED</text>
  <text x="195" y="354" font-family="Inter, sans-serif" font-size="12" fill="#a7f3d0">Real-Time ICU Vital Telemetry, 12-Lead ECG Canvas & NEWS2 Sepsis Evaluator</text>
  <rect x="640" y="336" width="120" height="28" rx="6" fill="url(#accent-med)"/>
  <text x="652" y="354" font-family="sans-serif" font-size="11" font-weight="800" fill="#022c22">GO + CANVAS</text>
</svg>
