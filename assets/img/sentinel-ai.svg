<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180505"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="accent-sec" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="16" fill="url(#bg-sec)" stroke="#7f1d1d" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="24" y="24" width="752" height="48" rx="8" fill="#450a0a" stroke="#991b1b"/>
  <text x="48" y="53" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">AGENTIC AI SECURITY AUDITOR // AST STATIC COMPILER PARSER</text>
  <rect x="600" y="36" width="156" height="24" rx="12" fill="#7f1d1d"/>
  <text x="615" y="52" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">SECURITY: 98.4 / 100</text>

  <!-- AST Compiler & OWASP Radar -->
  <rect x="24" y="90" width="360" height="210" rx="10" fill="#180505" stroke="#991b1b"/>
  <text x="40" y="125" font-family="monospace" font-size="13" font-weight="700" fill="#fca5a5">AST Compiler Vulnerability Scan</text>
  <text x="40" y="155" font-family="monospace" font-size="12" fill="#10b981">✓ SQL Injection Check: PASS</text>
  <text x="40" y="180" font-family="monospace" font-size="12" fill="#10b981">✓ Hardcoded Secrets Check: PASS</text>
  <text x="40" y="205" font-family="monospace" font-size="12" fill="#10b981">✓ Buffer Overflow Check: PASS</text>
  <text x="40" y="230" font-family="monospace" font-size="12" fill="#f59e0b">⚠ Unhandled Exception: LOW</text>

  <rect x="400" y="90" width="376" height="210" rx="10" fill="#180505" stroke="#991b1b"/>
  <text x="420" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#fca5a5">1-Click Unified Git Diff Patch Generator</text>
  <rect x="420" y="145" width="336" height="130" rx="6" fill="#450a0a"/>
  <text x="435" y="175" font-family="monospace" font-size="11" fill="#f87171">- query := "SELECT * FROM users WHERE id=" + id</text>
  <text x="435" y="200" font-family="monospace" font-size="11" fill="#4ade80">+ query := "SELECT * FROM users WHERE id=$1"</text>
  <text x="435" y="225" font-family="monospace" font-size="11" fill="#38bdf8">  stmt, err := db.Prepare(query)</text>

  <!-- Footer Banner -->
  <rect x="24" y="324" width="752" height="52" rx="8" fill="#450a0a" stroke="#991b1b"/>
  <text x="44" y="355" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">SENTINELAI AUDITOR</text>
  <text x="240" y="354" font-family="Inter, sans-serif" font-size="12" fill="#fca5a5">Autonomous Agentic AI AST Security Auditor & Auto-Remediation Engine</text>
  <rect x="635" y="336" width="125" height="28" rx="6" fill="url(#accent-sec)"/>
  <text x="648" y="354" font-family="sans-serif" font-size="11" font-weight="800" fill="#180505">PYTHON + AST</text>
</svg>
